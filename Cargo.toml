[package]
name = "aegira"
version = "4.0.0"
edition = "2021"
authors = ["Aegira Labs"]
description = "Aegira Linux automated incident detection and recovery engine with Docker-aware recovery"
license-file = "LICENSE"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
